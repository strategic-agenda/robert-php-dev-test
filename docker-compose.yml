version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: cat_php_fpm
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: cat_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:16
    container_name: cat_postgres
    restart: always
    environment:
      POSTGRES_DB: catdb
      POSTGRES_USER: catuser
      POSTGRES_PASSWORD: catpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  cat_postgres_test:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: catdb_test
      POSTGRES_USER: catuser
      POSTGRES_PASSWORD: catpass
    ports:
      - "5433:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
